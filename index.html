<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- SITE NAME -->
    <title>Teksoft Community</title>

    <!-- BASIC SEO -->
    <meta
      name="description"
      content="Teksoft Community is an innovation-driven tech community focused on AI, robotics, software engineering, and digital transformation."
    />

    <!-- CANONICAL -->
    <link rel="canonical" href="https://teksoft.co.ke" />

    <!-- PWA: REQUIRED -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />

    <!-- APP METADATA -->
    <meta name="application-name" content="Teksoft Community" />
    <meta name="apple-mobile-web-app-title" content="Teksoft Community" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- VIEWPORT -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SITE ICONS -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- OPEN GRAPH / SOCIAL SHARING -->
    <meta property="og:image" content="/favicon.png" />
    <meta property="og:title" content="Teksoft Community" />
    <meta
      property="og:description"
      content="Teksoft Community is an innovation-driven tech community focused on AI, robotics, software engineering, and digital transformation."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/favicon.png" />

    <!-- GOOGLE SITE NAME STRUCTURED DATA -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Teksoft Community",
        "alternateName": "Teksoft",
        "url": "https://teksoft.co.ke"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
